name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: v${{ steps.next.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve last version
        id: last
        run: |
          set -euo pipefail
          tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          version="${tag#v}"
          echo "version=${version:-0.0.0}" >>"$GITHUB_OUTPUT"

      - name: Resolve next version
        id: next
        env:
          LAST_VERSION: ${{ steps.last.outputs.version }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          footers="$(git log -1 --format=%b | awk 'BEGIN { RS = "" } END { print }')"
          if grep -Eiq '^[a-z]+(\([^)]+\))?!: ' <<<"$subject" || grep -Eq '^BREAKING[ -]CHANGE(: | #)' <<<"$footers"; then
            bump="major"
          elif grep -Eiq '^feat(\([^)]+\))?: ' <<<"$subject"; then
            bump="minor"
          else
            bump="patch"
          fi
          IFS=. read -r major minor patch <<<"$LAST_VERSION"
          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "version=$next" >>"$GITHUB_OUTPUT"

      - name: Update the manifest version
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(  \"version\": \")[^\"]+/\1$VERSION/" src/manifest.json
          grep -q "^  \"version\": \"$VERSION\"," src/manifest.json

      - name: Publish the release commit and tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifest.json
          # The first release already matches the manifest version, so the commit may be empty.
          git commit --allow-empty -m "chore(release): $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"

  package:
    name: Package
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        run: npm run build

      - name: Upload the extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: extension
          path: web-ext-artifacts/github-sso-keeper.zip
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub release
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: extension

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes github-sso-keeper.zip

  publish-store:
    name: Publish to ${{ matrix.store }}
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        store:
          - firefox
          - chrome
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Download the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: extension

      # Each store listing must exist before the first upload, because the CLI only submits new versions.
      - name: Submit to ${{ matrix.store }}
        env:
          STORE: ${{ matrix.store }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: npx --no-install publish-extension "--$STORE-zip" github-sso-keeper.zip
