name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.next_version }}
      tag: ${{ steps.next.outputs.next_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Compute next version
        id: next
        uses: lennartmoeller/next-version@d4aaf21be33352b91a81e9057fd8aff1d102d2cc # v1.0.0

      - name: Write version to extension manifest
        env:
          VERSION: ${{ steps.next.outputs.next_version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(  \"version\": \")[^\"]+/\1$VERSION/" src/manifest.json
          grep -q "^  \"version\": \"$VERSION\"," src/manifest.json

      - name: Push release commit and tag
        env:
          VERSION: ${{ steps.next.outputs.next_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          refs=("refs/tags/v$VERSION")
          if ! git diff --quiet; then
            git commit --all --message "chore(release): $VERSION [skip ci]"
            refs+=(HEAD:refs/heads/main)
          fi
          git tag --annotate "v$VERSION" --message "v$VERSION"
          git push --atomic origin "${refs[@]}"

  package:
    name: Package
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Build extension
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: web-ext-artifacts/github-sso-keeper.zip
          if-no-files-found: error

  publish-store:
    name: Publish to ${{ matrix.store }}
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        store:
          - firefox
          - chrome
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Download extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension

      # Each store listing must exist before the first upload, because the CLI only submits new versions.
      - name: Submit to ${{ matrix.store }}
        env:
          STORE: ${{ matrix.store }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if ! npx --no-install publish-extension "--$STORE-zip" github-sso-keeper.zip 2>&1 | tee "$log"; then
            # The Chrome Web Store rejects uploads while the previous version is in review; the next release carries this change.
            grep -q NOT_UPDATEABLE "$log" || exit 1
            echo "::warning::Skipped the $STORE upload because the previous version is still in review."
          fi

  release:
    name: Release
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes github-sso-keeper.zip
