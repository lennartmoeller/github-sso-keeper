<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitHub SSO Keeper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span id="dot"></span>
    <p id="details"></p>
  </header>
  <button id="renew" type="button">Renew now</button>
  <p id="note"></p>
  <label>
    Microsoft account
    <input id="account" type="text" placeholder="name@company.com" spellcheck="false">
  </label>
  <details>
    <summary>Event log</summary>
    <pre id="log"></pre>
  </details>
  <script src="popup.js"></script>
</body>
</html>
